<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tax & Standards Hub</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaxHub">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --accent-gold: #f59e0b;
      --border: #334155;
      --ghana-red: #ef4444;
      --global-blue: #3b82f6;
      --standards-green: #10b981;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0; padding: 0;
      padding-bottom: 70px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Executive Header */
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 1.2rem 1rem 0.8rem 1rem;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 800; color: #fff; }
    .notif-btn {
      background: #334155; border: none; color: #fff;
      padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.75rem;
      font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    
    /* Search Bar */
    .search-box {
      margin-top: 0.8rem;
    }
    .search-input {
      width: 100%; background: #1e293b; border: 1px solid var(--border);
      border-radius: 8px; color: #fff; padding: 0.6rem 0.9rem; font-size: 0.85rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    /* Nav Tabs */
    .nav-bar {
      display: flex; background: #0f172a; border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .nav-item {
      flex: 1; min-width: 90px; text-align: center; padding: 0.75rem 0.5rem;
      font-size: 0.8rem; font-weight: 600; color: var(--subtext);
      border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
    }
    .nav-item.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Alert Banner */
    .alert-banner {
      background: rgba(245, 158, 11, 0.15); border: 1px solid var(--accent-gold);
      color: var(--accent-gold); padding: 0.8rem; margin: 0.8rem 1rem 0 1rem;
      border-radius: 8px; font-size: 0.8rem; display: none; line-height: 1.4;
    }

    /* Container & Cards */
    .container { padding: 1rem; max-width: 650px; margin: 0 auto; }
    .card {
      background: var(--card-bg); border-radius: 12px; padding: 1.1rem;
      margin-bottom: 1rem; border: 1px solid var(--border); position: relative;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
    .tag {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      padding: 0.2rem 0.5rem; border-radius: 4px;
    }
    .tag-ghana { background: rgba(239, 68, 68, 0.2); color: var(--ghana-red); }
    .tag-global { background: rgba(59, 130, 246, 0.2); color: var(--global-blue); }
    .tag-standards { background: rgba(16, 185, 129, 0.2); color: var(--standards-green); }
    
    .star-btn {
      background: none; border: none; font-size: 1.1rem; color: var(--subtext); cursor: pointer;
    }
    .star-btn.saved { color: var(--accent-gold); }

    .card h3 { margin: 0 0 0.4rem 0; font-size: 0.98rem; line-height: 1.4; color: #fff; }
    .card p { margin: 0 0 0.8rem 0; font-size: 0.85rem; color: var(--subtext); line-height: 1.45; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #64748b; }
    .card-footer a { color: var(--accent); font-weight: 600; text-decoration: none; }

    /* Rates Table View */
    .rate-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .rate-section h3 { margin-top: 0; color: var(--accent); font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 0.5rem; }
    th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--subtext); }

    .loader { text-align: center; padding: 3rem 1rem; color: var(--subtext); font-size: 0.85rem; }

    /* Bottom Quick-Action Nav */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a;
      border-top: 1px solid var(--border); display: flex; justify-content: space-around;
      padding: 0.6rem 0; z-index: 100;
    }
    .bottom-bar button {
      background: none; border: none; color: var(--subtext); font-size: 0.72rem;
      display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 600;
    }
    .bottom-bar button.active { color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Tax & Standards Hub</h1>
      <button class="notif-btn" onclick="toggleNotifications()">🔔 Enable Alerts</button>
    </div>
    <div class="search-box">
      <input type="text" class="search-input" id="search-input" placeholder="Search Ghana tax, VAT, PAYE, IFRS..." oninput="handleSearch()">
    </div>
  </header>

  <div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('feed', this)">Live News</div>
    <div class="nav-item" onclick="switchTab('ghana', this)">Ghana Tax</div>
    <div class="nav-item" onclick="switchTab('rates', this)">GRA Rates Sheet</div>
    <div class="nav-item" onclick="switchTab('standards', this)">IFRS / IAS</div>
    <div class="nav-item" onclick="switchTab('saved', this)">Vault (Saved)</div>
  </div>

  <div class="alert-banner" id="alert-banner"></div>

  <div class="container" id="content-area">
    <div class="loader">Fetching updates from GRA, Citi Business, and IFRS...</div>
  </div>

  <div class="bottom-bar">
    <button class="active" onclick="switchTab('feed', null)">📰 Feeds</button>
    <button onclick="switchTab('rates', null)">📊 GRA Rates</button>
    <button onclick="switchTab('saved', null)">⭐ Saved Vault</button>
  </div>

  <script>
    const feeds = [
      { category: 'ghana', tagClass: 'tag-ghana', label: 'Ghana Tax', url: 'https://news.google.com/rss/search?q=Ghana+Revenue+Authority+OR+Ghana+tax+rates&hl=en-GH&gl=GH&ceid=GH:en' },
      { category: 'ghana', tagClass: 'tag-ghana', label: 'Ghana Business', url: 'https://news.google.com/rss/search?q=Ghana+budget+tax+policy+Ministry+of+Finance&hl=en-GH&gl=GH&ceid=GH:en' },
      { category: 'global', tagClass: 'tag-global', label: 'Global Tax', url: 'https://news.google.com/rss/search?q=Global+minimum+tax+OECD+Pillar+Two&hl=en-US&gl=US&ceid=US:en' },
      { category: 'standards', tagClass: 'tag-standards', label: 'Standards', url: 'https://news.google.com/rss/search?q=IFRS+accounting+standards+IASB+amendment&hl=en-US&gl=US&ceid=US:en' }
    ];

    let allItems = [];
    let currentTab = 'feed';

    async function fetchFeeds() {
      try {
        const fetchPromises = feeds.map(feed => 
          fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`)
            .then(res => res.json())
            .then(data => (data.items || []).map(item => ({
              id: item.guid || item.link,
              title: item.title,
              link: item.link,
              pubDate: item.pubDate,
              description: item.description ? item.description.replace(/<[^>]*>?/gm, '') : '',
              category: feed.category,
              label: feed.label,
              tagClass: feed.tagClass
            })))
        );

        const results = await Promise.all(fetchPromises);
        const fetched = results.flat();

        // Save into local persistence vault
        let storedVault = JSON.parse(localStorage.getItem('tax_vault_articles') || '[]');
        const combined = [...fetched, ...storedVault];
        
        // Remove duplicates by ID
        const uniqueMap = new Map();
        combined.forEach(item => uniqueMap.set(item.id, item));
        allItems = Array.from(uniqueMap.values()).sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
        
        localStorage.setItem('tax_vault_articles', JSON.stringify(allItems.slice(0, 100)));

        checkForTaxAlerts(fetched);
        renderCurrentTab();
      } catch (e) {
        let storedVault = JSON.parse(localStorage.getItem('tax_vault_articles') || '[]');
        if (storedVault.length) {
          allItems = storedVault;
          renderCurrentTab();
        } else {
          document.getElementById('content-area').innerHTML = `<div class="loader">Unable to fetch live updates. Please check network connection.</div>`;
        }
      }
    }

    function checkForTaxAlerts(items) {
      const keywords = ['act', 'amendment', 'paye', 'gazette', 'vat threshold', 'gra policy'];
      const alertItem = items.find(i => keywords.some(kw => i.title.toLowerCase().includes(kw)));
      
      if (alertItem) {
        const banner = document.getElementById('alert-banner');
        banner.style.display = 'block';
        banner.innerHTML = `<strong>⚠️ Recent Policy Notice Detected:</strong> ${alertItem.title} (<a href="${alertItem.link}" target="_blank" style="color:var(--accent)">Read Update</a>)`;
      }
    }

    function renderCards(items) {
      const container = document.getElementById('content-area');
      const savedIds = JSON.parse(localStorage.getItem('tax_bookmarks') || '[]');

      if (!items.length) {
        container.innerHTML = `<div class="loader">No articles found.</div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const isSaved = savedIds.includes(item.id);
        return `
          <div class="card">
            <div class="card-header">
              <span class="tag ${item.tagClass}">${item.label}</span>
              <button class="star-btn ${isSaved ? 'saved' : ''}" onclick="toggleBookmark('${item.id.replace(/'/g, "\\'")}')">${isSaved ? '★' : '☆'}</button>
            </div>
            <h3>${item.title}</h3>
            <p>${item.description.substring(0, 150)}...</p>
            <div class="card-footer">
              <span>${new Date(item.pubDate).toLocaleDateString()}</span>
              <a href="${item.link}" target="_blank" rel="noopener">Read Full Article &rarr;</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderRatesSheet() {
      const container = document.getElementById('content-area');
      container.innerHTML = `
        <div class="rate-section">
          <h3>🇬🇭 Ghana PAYE Tax Bands (Income Tax Act 1178)</h3>
          <table>
            <tr><th>Monthly Chargeable Income</th><th>Rate</th></tr>
            <tr><td>First GH¢588</td><td>0% (Tax Free)</td></tr>
            <tr><td>Next GH¢80</td><td>5%</td></tr>
            <tr><td>Next GH¢100</td><td>10%</td></tr>
            <tr><td>Next GH¢2,900</td><td>17.5%</td></tr>
            <tr><td>Next GH¢16,000</td><td>25%</td></tr>
            <tr><td>Next GH¢30,332</td><td>30%</td></tr>
            <tr><td>Exceeding GH¢50,000</td><td>35%</td></tr>
          </table>
        </div>

        <div class="rate-section">
          <h3>📋 Value Added Tax (VAT) & Levies</h3>
          <table>
            <tr><th>Tax / Levy Component</th><th>Standard Rate</th></tr>
            <tr><td>Value Added Tax (VAT)</td><td>15.0%</td></tr>
            <tr><td>National Health Insurance Levy (NHIL)</td><td>2.5%</td></tr>
            <tr><td>GETFund Levy</td><td>2.5%</td></tr>
            <tr><td>COVID-19 Health Recovery Levy</td><td>1.0%</td></tr>
            <tr><td>SME Presumptive Tax Scheme</td><td>3.0% of Turnover</td></tr>
          </table>
        </div>

        <div class="rate-section">
          <h3>💼 Withholding Tax Rates (WHT)</h3>
          <table>
            <tr><th>Transaction Type</th><th>Rate</th></tr>
            <tr><td>Supply of Goods</td><td>3.0%</td></tr>
            <tr><td>Supply of Services</td><td>7.5%</td></tr>
            <tr><td>Works / Construction</td><td>5.0%</td></tr>
            <tr><td>Dividends / Interest Paid to Residents</td><td>8.0%</td></tr>
          </table>
        </div>
      `;
    }

    function switchTab(tab, element) {
      currentTab = tab;
      if (element) {
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        element.classList.add('active');
      }

      handleSearch();
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.toLowerCase();
      
      if (currentTab === 'rates') {
        renderRatesSheet();
        return;
      }

      let filtered = allItems;
      if (currentTab === 'ghana') filtered = allItems.filter(i => i.category === 'ghana');
      if (currentTab === 'standards') filtered = allItems.filter(i => i.category === 'standards');
      if (currentTab === 'saved') {
        const savedIds = JSON.parse(localStorage.getItem('tax_bookmarks') || '[]');
        filtered = allItems.filter(i => savedIds.includes(item => item.id));
      }

      if (query) {
        filtered = filtered.filter(i => i.title.toLowerCase().includes(query) || i.description.toLowerCase().includes(query));
      }

      renderCards(filtered);
    }

    function toggleBookmark(id) {
      let savedIds = JSON.parse(localStorage.getItem('tax_bookmarks') || '[]');
      if (savedIds.includes(id)) {
        savedIds = savedIds.filter(i => i !== id);
      } else {
        savedIds.push(id);
      }
      localStorage.setItem('tax_bookmarks', JSON.stringify(savedIds));
      handleSearch();
    }

    function toggleNotifications() {
      if (!("Notification" in window)) {
        alert("Web notifications are not supported on this browser version.");
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("Alerts Enabled! You will receive push notifications when critical Ghana tax updates are published.");
          new Notification("Tax Hub Alerts Active", { body: "You are subscribed to Ghana tax & IFRS updates." });
        }
      });
    }

    fetchFeeds();
  </script>
</body>
</html>
